name: Kaleidoscope CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true

    - name: Syntax and Compile Validation
      run: |
        python -m py_compile flow_runner.py
        python -m py_compile run_batch.py
        python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('flow_studio/**/*.py', recursive=True)]"
        python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('pipeline/**/*.py', recursive=True)]"
        python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('scripts/**/*.py', recursive=True)]"
